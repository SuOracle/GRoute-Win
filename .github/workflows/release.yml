name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. 2.1.0"
        required: true

permissions:
  contents: write

env:
  PROJECT: src/GRoute.Desktop/GRoute.Desktop.csproj
  PUBLISH: src/GRoute.Desktop/bin/Release/net10.0/win-x64/publish
  LIBS: src/GRoute.Desktop/libs

  XRAY_VERSION: v25.9.11
  SINGBOX_VERSION: 1.11.15
  TUN2SOCKS_VERSION: v2.6.0
  TOR_VERSION: 14.5.7

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $v = "${{ github.event.inputs.version }}"
          } else {
            $v = "${{ github.ref_name }}" -replace '^v', ''
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "building $v"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache engine binaries
        id: libs-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.LIBS }}
          key: libs-${{ env.XRAY_VERSION }}-${{ env.SINGBOX_VERSION }}-${{ env.TUN2SOCKS_VERSION }}-${{ env.TOR_VERSION }}

      - name: Download engine binaries
        if: steps.libs-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "${{ env.LIBS }}" | Out-Null
          $tmp = Join-Path $env:RUNNER_TEMP "dl"
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null

          function Grab($url, $out) {
            Write-Host "-> $url"
            Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing
          }

          # Xray
          Grab "https://github.com/XTLS/Xray-core/releases/download/$env:XRAY_VERSION/Xray-windows-64.zip" "$tmp/xray.zip"
          Expand-Archive "$tmp/xray.zip" "$tmp/xray" -Force
          Copy-Item "$tmp/xray/xray.exe" "${{ env.LIBS }}/" -Force
          Copy-Item "$tmp/xray/geoip.dat","$tmp/xray/geosite.dat" "${{ env.LIBS }}/" -Force

          # sing-box (Hysteria2)
          $sb = "sing-box-$env:SINGBOX_VERSION-windows-amd64"
          Grab "https://github.com/SagerNet/sing-box/releases/download/v$env:SINGBOX_VERSION/$sb.zip" "$tmp/sb.zip"
          Expand-Archive "$tmp/sb.zip" "$tmp/sb" -Force
          Copy-Item "$tmp/sb/$sb/sing-box.exe" "${{ env.LIBS }}/" -Force

          # tun2socks
          Grab "https://github.com/xjasonlyu/tun2socks/releases/download/$env:TUN2SOCKS_VERSION/tun2socks-windows-amd64.zip" "$tmp/t2s.zip"
          Expand-Archive "$tmp/t2s.zip" "$tmp/t2s" -Force
          Get-ChildItem "$tmp/t2s" -Recurse -Filter "tun2socks*.exe" |
            Select-Object -First 1 |
            ForEach-Object { Copy-Item $_.FullName "${{ env.LIBS }}/tun2socks-windows-amd64.exe" -Force }

          # wintun
          Grab "https://www.wintun.net/builds/wintun-0.14.1.zip" "$tmp/wintun.zip"
          Expand-Archive "$tmp/wintun.zip" "$tmp/wintun" -Force
          Copy-Item "$tmp/wintun/wintun/bin/amd64/wintun.dll" "${{ env.LIBS }}/" -Force

          # Tor expert bundle: tor.exe plus the geoip databases
          Grab "https://archive.torproject.org/tor-package-archive/torbrowser/$env:TOR_VERSION/tor-expert-bundle-windows-x86_64-$env:TOR_VERSION.tar.gz" "$tmp/tor.tar.gz"
          tar -xzf "$tmp/tor.tar.gz" -C $tmp
          Copy-Item "$tmp/tor/tor.exe" "${{ env.LIBS }}/" -Force
          Copy-Item "$tmp/data/geoip","$tmp/data/geoip6" "${{ env.LIBS }}/" -Force

          Get-ChildItem "${{ env.LIBS }}" | Select-Object Name, Length | Format-Table

      - name: Fail if an engine binary is missing
        shell: pwsh
        run: |
          $need = @("xray.exe","geoip.dat","geosite.dat","sing-box.exe",
                    "tun2socks-windows-amd64.exe","wintun.dll","tor.exe","geoip","geoip6")
          $missing = $need | Where-Object { -not (Test-Path "${{ env.LIBS }}/$_") }
          if ($missing) { throw "missing from libs: $($missing -join ', ')" }
          Write-Host "all $($need.Count) engine files present"

      - name: Restore
        run: dotnet restore ${{ env.PROJECT }}

      - name: Publish
        run: >
          dotnet publish ${{ env.PROJECT }} -c Release
          -p:Version=${{ steps.ver.outputs.version }}
          -p:AssemblyVersion=${{ steps.ver.outputs.version }}.0
          -p:FileVersion=${{ steps.ver.outputs.version }}.0
          -p:InformationalVersion=${{ steps.ver.outputs.version }}

      - name: Check the publish output
        shell: pwsh
        run: |
          if (-not (Test-Path "${{ env.PUBLISH }}/GRoute.exe")) { throw "GRoute.exe not published" }
          $n = (Get-ChildItem "${{ env.PUBLISH }}/libs" -ErrorAction SilentlyContinue).Count
          if (-not $n) { throw "libs/ did not reach the publish folder" }
          Write-Host "published GRoute.exe and $n files in libs/"

      - name: Portable zip
        shell: pwsh
        run: |
          $name = "GRoute-${{ steps.ver.outputs.version }}-win-x64-portable.zip"
          Compress-Archive -Path "${{ env.PUBLISH }}/*" -DestinationPath $name -Force
          Write-Host $name

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=${{ steps.ver.outputs.version }}" `
            "src\GRoute.Desktop\GRoute.iss"
          Get-ChildItem "src\GRoute.Desktop\dist" | Format-Table Name, Length

      - name: Checksums
        shell: pwsh
        run: |
          $files = @(Get-ChildItem "*.zip") + @(Get-ChildItem "src\GRoute.Desktop\dist\*.exe")
          $lines = foreach ($f in $files) {
            $h = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($f.Name)"
          }
          $lines | Set-Content "SHA256SUMS.txt" -Encoding ascii
          Get-Content "SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: GRoute-${{ steps.ver.outputs.version }}
          path: |
            *.zip
            src/GRoute.Desktop/dist/*.exe
            SHA256SUMS.txt

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: GRoute ${{ steps.ver.outputs.version }}
          draft: true
          generate_release_notes: true
          files: |
            *.zip
            src/GRoute.Desktop/dist/*.exe
            SHA256SUMS.txt
          body: |
            ## GRoute ${{ steps.ver.outputs.version }}

            **Installer** — `GRoute-${{ steps.ver.outputs.version }}-setup.exe`
            **Portable** — unzip and run `GRoute.exe`

            Verify what you downloaded against `SHA256SUMS.txt` before running it:

            ```
            certutil -hashfile GRoute-${{ steps.ver.outputs.version }}-setup.exe SHA256
            ```

            Bundled engines: Xray `${{ env.XRAY_VERSION }}`, sing-box `${{ env.SINGBOX_VERSION }}`,
            tun2socks `${{ env.TUN2SOCKS_VERSION }}`, Tor `${{ env.TOR_VERSION }}`.
